<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Listing Writer Pro | Real Estate Marketing Pro</title>

  <meta name="theme-color" content="#192744">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="Listing Writer Pro | Real Estate Marketing Pro">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* Values measured from www.realestatemarketing.pro at 1440px wide */
    :root { --header-h: 101px; --pad: 4vw; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; overflow-x: hidden; }
    body { font-family: "Poppins", sans-serif; font-weight: 300; font-size: 16px; color: #000; }

    /* Header */
    .site-header {
      position: relative; z-index: 20; height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding: 0 var(--pad); background: #fff;
    }
    .logo { min-width: 0; flex: 0 1 auto; }
    .logo img { display: block; height: 32px; width: auto; max-width: 100%; object-fit: contain; object-position: left center; }
    .nav { display: flex; flex-wrap: wrap; justify-content: flex-end; column-gap: 16px; max-width: 655px; }
    .nav a {
      color: #000; text-decoration: none; font-size: 16px; line-height: 32px; white-space: nowrap;
      background: linear-gradient(#000,#000) no-repeat left calc(100% - 2px) / 0 1px; transition: background-size .2s;
    }
    .nav a:hover, .nav a.active { background-size: 100% 1px; }
    .menu-btn { display: none; flex: 0 0 auto; background: none; border: 0; padding: 8px; cursor: pointer; }
    .menu-btn span { display: block; width: 24px; height: 1.5px; background: #000; margin: 5px 0; }

    /* Chat fills the first screen under the header */
    .chat { display: block; border: 0; width: 100%; height: calc(100vh - var(--header-h)); height: calc(100dvh - var(--header-h)); }

    /* Footer (matches the site footer) */
    .site-footer { background: #000; color: #fff; padding: 64px var(--pad) 56px; }
    .site-footer a { color: #fff; }
    .f-grid { display: grid; grid-template-columns: 1fr auto auto; column-gap: 66px; align-items: start; }
    .f-title { font-family: "Poppins", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: .01em; margin: 0 0 58px; }
    .f-contact p { margin: 0 0 16px; line-height: 29px; }
    .f-social { display: flex; gap: 16px; margin-top: 34px; padding-left: 28px; }
    .f-social svg { width: 28px; height: 28px; fill: #fff; display: block; }
    .f-links { list-style: none; margin: 40px 0 0; padding: 0; width: 156px; }
    .f-links li { line-height: 29px; margin-bottom: 16px; }
    .f-badges { display: flex; justify-content: center; margin-top: 34px; }
    .f-badges img { width: 323px; height: auto; display: block; }

    @media (max-width: 1100px) {
      :root { --header-h: 64px; }
      .site-header { padding: 0 16px; gap: 12px; }
      .logo img { height: auto; max-height: 18px; }
      .menu-btn { display: block; }
      .nav {
        display: none; position: absolute; top: var(--header-h); left: 0; right: 0; max-width: none;
        flex-direction: column; align-items: flex-start; background: #fff;
        border-bottom: 1px solid #eee; padding: 8px 24px 20px;
      }
      .nav.open { display: flex; }
      .nav a { font-size: 17px; line-height: 48px; background: none; }
      .nav a.active { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
      .site-footer { padding: 48px 24px 40px; }
      .f-grid { grid-template-columns: 1fr 1fr; row-gap: 8px; }
      .f-left { grid-column: 1 / -1; }
      .f-title { font-size: 22px; margin-bottom: 28px; }
      .f-links { margin-top: 24px; width: auto; }
      .f-badges img { width: 260px; }
    }
  </style>
</head>

  <script>

    btn.addEventListener('click', () => {
